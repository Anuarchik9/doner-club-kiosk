all{color:#6f5c52}.orderModeFoot{margin-top:23px;color:#9a9189;font-size:11px;font-weight:800}.modePending .cats,.modePending .content,.modePending .orderbar,.modePending .carthead{display:none!important}.modeChosen .orderModeScreen{display:none}.serviceModeBadge{display:none;padding:8px 11px;border-radius:12px;background:#f3f0ec;color:#3d3935;font-size:12px;font-weight:950;white-space:nowrap;cursor:pointer;transition:background .15s ease,transform .15s ease}.serviceModeBadge:hover{background:#ebe6e0;transform:translateY(-1px)}.modeChosen .serviceModeBadge{display:inline-flex}

<body>
<div id="app" class="modePending">
  <div class="top">
    <div class="brand"><div class="mark">DC</div>DONER CLUB</div>
    <div id="pointBadge" class="pointBadge" title="Удерживайте для обновления меню">Арай</div>
    <div id="serviceModeBadge" class="serviceModeBadge"></div>
    <div id="status" class="status" aria-hidden="true"></div>
    <div class="langs"><button id="kzBtn">ҚАЗ</button><button id="ruBtn" class="on">РУС</button></div>
    <button id="cartHead" class="carthead">Корзина · 0</button>
  </div>
  <section id="orderModeScreen" class="orderModeScreen">
    <div class="orderModeInner">
      <div class="orderModeEyebrow">DONER CLUB · АРАЙ</div>
      <h1 id="orderModeTitle" class="orderModeTitle">Где будете есть?</h1>
      <p id="orderModeLead" class="orderModeLead">Выберите тип заказа — дальше откроется меню.</p>
      <div class="orderModeChoices">
        <button id="modeDineIn" class="orderModeChoice dinein" type="button">
          <span class="orderModeIcon" aria-hidden="true"><svg viewBox="0 0 64 64"><path d="M16 34h32"/><path d="M20 34a12 12 0 0 1 24 0"/><path d="M32 18v-4"/><path d="M12 42h40"/><path d="M17 42v8"/><path d="M47 42v8"/></svg></span>
          <strong id="modeDineInText">В зале</strong>
          <small id="modeDineInSub">Заказ здесь</small>
        </button>
        <button id="modeTakeaway" class="orderModeChoice takeaway" type="button">
          <span class="orderModeIcon" aria-hidden="true"><svg viewBox="0 0 64 64"><path d="M18 24h28l-3 28H21z"/><path d="M24 24v-4a8 8 0 0 1 16 0v4"/><path d="M25 34h14"/><path d="M32 29v10"/></svg></span>
          <strong id="modeTakeawayText">С собой</strong>
          <small id="modeTakeawaySub">Упакуем заказ</small>
        </button>
      </div>
    </div>
  </section>
  <div id="cats" class="cats"></div>
  <div class="content">
    <div class="titleRow"><h1 id="title">Все меню</h1></div>
    <div id="setup"></div>
    <div id="grid" class="grid"><div class="empty"><b>Загружаю меню…</b>Получаю категории, блюда, цены и фотографии из iiko.</div></div>
  </div>
  <div class="orderbar">
    <div class="sumwrap"><div id="count" class="count">Корзина пуста</div><div id="sum" class="sum">0 ₸</div></div>
    <div id="cartItems" class="items">Выберите блюда из меню</div>
    <button id="checkout" class="checkout" disabled>Оформить заказ · 0 ₸</button>
  </div>
</div>
<div id="modalRoot"></div>
<script>
var lang='ru', categories=[], products=[], activeCat=null, cart=[], selected=null, menuReady=false, retryTimer=null, customerPhone='', crmWelcomeEligible=false, crmWelcomePercent=0, crmCustomerExists=false, crmLookupReady=false, orderMode=null;
var CAT_KZ={'Комбо':'Комбо','Донер':'Донерлер','Донеры':'Донерлер','Бар':'Сусындар','Напитки':'Сусындар','Чаи':'Шай','Сладости':'Тәттілер','Дополнительное':'Қосымша','Дополнительно':'Қосымша','Батоны':'Батондар','Фри':'Фри','Стрипсы':'Стрипстер','Акции':'Науқандар'};
var MENU_CACHE_KEY='donerclub-kiosk-arai-menu-v1', MENU_CACHE_TTL=10*60*1000;
var CART_SESSION_KEY='donerclub-kiosk-arai-cart-v1';
var navScrollLockUntil=0;
function t(ru,kz){return lang==='ru'?ru:kz}
function money(n){return Number(n||0).toLocaleString('ru-RU')+' ₸'}
function categoryName(c){return lang==='ru'?c.name:(CAT_KZ[c.name]||c.name)}
function productName(p){return p.name}
function count(){return cart.reduce(function(s,x){return s+x.q},0)}
function total(){return cart.reduce(function(s,x){return s+x.q*x.unitPrice},0)}
function welcomeDiscountAmount(){return crmWelcomeEligible?Number((total()*(Number(crmWelcomePercent)||0)/100).toFixed(2)):0}
function payableTotal(){return Math.max(0,Number((total()-welcomeDiscountAmount()).toFixed(2)))}
function resetCrmDiscount(){crmWelcomeEligible=false;crmWelcomePercent=0;crmCustomerExists=false;crmLookupReady=false}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}

function normOptionText(value){
  return String(value||'').toLowerCase().replace(/ё/g,'е').replace(/[—–−_]+/g,' ').replace(/[^a-zа-я0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
}
function optionMode(name){
  var text=normOptionText(name);
  if(text.indexOf('с собой')>=0 || text.indexOf('на вынос')>=0)return 'takeaway';
  if(text.indexOf('в зале')>=0 || text==='зале' || text.indexOf('зал')>=0)return 'dinein';
  if(text.indexOf('летник')>=0 || text.indexOf('летняя')>=0)return 'terrace';
  return null;
}
function isOrderTypeGroup(group){
  if(!group)return false;
  var groupName=normOptionText(group.name);
  if(groupName.indexOf('тип заказа')>=0 || groupName.indexOf('формат заказа')>=0)return true;
  var kinds={};
  (group.items||[]).forEach(function(item){var k=optionMode(item.name);if(k)kinds[k]=true});
  return !!(kinds.dinein&&kinds.takeaway);
}
function visibleModifierGroups(product){
  return (product&&product.modifierGroups||[]).filter(function(group){
    return group.items&&group.items.length&&!isOrderTypeGroup(group);
  });
}
function selectedServiceModifier(product){
  if(!orderMode||!product)return null;
  var group=(product.modifierGroups||[]).find(isOrderTypeGroup);
  if(!group)return null;
  var item=(group.items||[]).find(function(modifier){return optionMode(modifier.name)===orderMode});
  if(!item)return null;
  return {
    id:item.id,
    groupId:group.id||'',
    name:item.name||'',
    price:Number(item.price||0)
  };
}
function appendServiceModifier(product,mods,modIds,modGroupIds){
  var service=selectedServiceModifier(product);
  if(!service)return 0;
  if(modIds.indexOf(service.id)<0){
    mods.push(service.name);
    modIds.push(service.id);
    modGroupIds.push(service.groupId);
  }
  return service.price;
}
function applyOrderModeToExistingCart(){
  if(!orderMode||!products.length||!cart.length)return;
  cart.forEach(function(line){
    var product=products.find(function(p){return p.id===line.productId});
    if(!product)return;
    var oldMods=Array.isArray(line.mods)?line.mods:[];
    var oldIds=Array.isArray(line.modifierIds)?line.modifierIds:[];
    var oldGroups=Array.isArray(line.modifierGroupIds)?line.modifierGroupIds:[];
    var keepMods=[],keepIds=[],keepGroups=[];
    oldIds.forEach(function(id,index){
      var name=oldMods[index]||'';
      if(optionMode(name))return;
      keepIds.push(id);keepMods.push(name);keepGroups.push(oldGroups[index]||'');
    });
    appendServiceModifier(product,keepMods,keepIds,keepGroups);
    line.mods=keepMods;line.modifierIds=keepIds;line.modifierGroupIds=keepGroups;
    line.key=line.productId+'|'+keepIds.slice().sort().join(',');
  });
  persistCartSession();
}
function paintOrderModeScreen(){
  var app=document.getElementById('app');
  if(!app)return;
  app.classList.toggle('modePending',!orderMode);
  app.classList.toggle('modeChosen',!!orderMode);
  var title=document.getElementById('orderModeTitle');
  if(title)title.textContent=t('Где будете есть?','Қай жерде жейсіз?');
  var lead=document.getElementById('orderModeLead');
  if(lead)lead.textContent=t('Выберите тип заказа — дальше откроется меню.','Тапсырыс түрін таңдаңыз — содан кейін мәзір ашылады.');
  var dine=document.getElementById('modeDineInText');
  if(dine)dine.textContent=t('В зале','Залда');
  var dineSub=document.getElementById('modeDineInSub');
  if(dineSub)dineSub.textContent=t('Заказ здесь','Осында ішіп-жейсіз');
  var take=document.getElementById('modeTakeawayText');
  if(take)take.textContent=t('С собой','Өзіңізбен');
  var takeSub=document.getElementById('modeTakeawaySub');
  if(takeSub)takeSub.textContent=t('Упакуем заказ','Тапсырысты орап береміз');
  var badge=document.getElementById('serviceModeBadge');
  if(badge)badge.textContent=orderMode==='dinein'?t('В зале','Залда'):orderMode==='takeaway'?t('С собой','Өзіңізбен'):'';
}
function chooseOrderMode(mode){
  if(mode!=='dinein'&&mode!=='takeaway')return;
  orderMode=mode;
  applyOrderModeToExistingCart();
  paintOrderModeScreen();
  paint();
  var content=document.querySelector('.content');
  if(content)content.scrollTop=0;
}
function resetOrderMode(){
  orderMode=null;
  paintOrderModeScreen();
}
function restoreCartSession(){
  try{
    var raw=sessionStorage.getItem(CART_SESSION_KEY);
    if(!raw)return;
    var saved=JSON.parse(raw);
    if(!Array.isArray(saved))return;
    cart=saved.filter(function(x){
      return x&&x.productId&&Number.isFinite(Number(x.q))&&Number(x.q)>=1&&Number.isFinite(Number(x.unitPrice))&&Number(x.unitPrice)>=0;
    }).map(function(x){
      x.q=Math.max(1,Math.floor(Number(x.q)||1));
      x.unitPrice=Number(x.unitPrice)||0;
      x.mods=Array.isArray(x.mods)?x.mods:[];
      x.modifierIds=Array.isArray(x.modifierIds)?x.modifierIds:[];
      x.modifierGroupIds=Array.isArray(x.modifierGroupIds)?x.modifierGroupIds:[];
      return x;
    });
  }catch(e){}
}
function persistCartSession(){
  try{
    sessionStorage.setItem(CART_SESSION_KEY,JSON.stringify(cart));
  }catch(e){}
}
function pushMenuNow(){
  try{localStorage.removeItem(MENU_CACHE_KEY)}catch(e){}
  var badge=document.getElementById('pointBadge');
  if(badge){
    badge.classList.add('pushing');
    badge.textContent=t('Арай · обновление','Арай · жаңарту');
  }
  loadMenu(true).finally(function(){
    if(badge){
      badge.classList.remove('pushing');
      badge.textContent='Арай';
    }
  });
}
function enableMenuPushGesture(){
  var badge=document.getElementById('pointBadge');
  if(!badge)return;

  var timer=null;
  var cancel=function(){
    if(timer){clearTimeout(timer);timer=null;}
  };

  badge.addEventListener('pointerdown',function(event){
    cancel();
    timer=setTimeout(function(){
      timer=null;
      pushMenuNow();
    },1100);
  });
  badge.addEventListener('pointerup',cancel);
  badge.addEventListener('pointercancel',cancel);
  badge.addEventListener('pointerleave',cancel);

  // Desktop shortcut: double-click the location badge.
  badge.addEventListener('dblclick',function(event){
    event.preventDefault();
    pushMenuNow();
  });
}
function readMenuCache(){
  try{
    var raw=localStorage.getItem(MENU_CACHE_KEY);
    if(!raw)return null;
    var cached=JSON.parse(raw);
    if(!cached||!cached.savedAt||!cached.data)return null;
    return cached;
  }catch(e){
    return null;
  }
}
function writeMenuCache(data){
  try{
    localStorage.setItem(MENU_CACHE_KEY,JSON.stringify({
      savedAt:Date.now(),
      data:data
    }));
  }catch(e){}
}
function applyMenuData(data){
  categories=data.categories||[];
  products=data.products||[];
  activeCat='all';
  menuReady=true;
  applyOrderModeToExistingCart();
  var status=document.getElementById('status');
  status.className='status ok';
  status.textContent='Kiosk Арай · iiko · '+products.length+' поз.';
  document.getElementById('setup').innerHTML='';
  paint();
}
function scheduleMenuRefresh(delay){
  if(retryTimer){clearTimeout(retryTimer);retryTimer=null;}
  retryTimer=setTimeout(function(){loadMenu(true)},Math.max(1000,delay));
}
async function loadMenu(force){
  var status=document.getElementById('status');
  var cached=readMenuCache();

  if(!force&&cached){
    var age=Date.now()-cached.savedAt;
    if(age<MENU_CACHE_TTL){
      applyMenuData(cached.data);
      scheduleMenuRefresh(MENU_CACHE_TTL-age);
      return;
    }
  }

  if(!products.length){
    status.className='status';
    status.textContent='Kiosk Арай · загружаю iiko…';
  }else{
    status.className='status ok';
    status.textContent='Kiosk Арай · обновляю меню…';
  }

  try{
    var r=await fetch('/kiosk-menu?point=Arai&menu='+encodeURIComponent('Kiosk Арай'),{cache:'no-store'});
    var data=await r.json();
    if(!r.ok||!data.success) throw data;

    writeMenuCache(data);
    applyMenuData(data);
    scheduleMenuRefresh(MENU_CACHE_TTL);
  }catch(e){
    if(cached&&cached.data){
      applyMenuData(cached.data);
      status.className='status ok';
      status.textContent='Kiosk Арай · сохранённое меню · '+products.length+' поз.';
      scheduleMenuRefresh(60*1000);
      return;
    }

    menuReady=false;
    status.className='status err';
    status.textContent='Kiosk Арай · не доступно через API';
    var names=(e&&e.availableMenus||[]).map(function(x){return x.name}).filter(Boolean);
    document.getElementById('setup').innerHTML='<div class="setup"><b>'+t('Не удалось загрузить меню. Повторяем подключение…','Мәзір жүктелмеді. Қайта қосылып жатырмыз…')+'</b><br>'+esc(e.message||e.code||t('Проверьте подключение к сети.','Желіге қосылуды тексеріңіз.'))+(names.length?'<br>'+t('Доступные меню: ','Қолжетімді мәзірлер: ')+esc(names.join(', ')):'')+'</div>';
    categories=[];products=[];paint();
    scheduleMenuRefresh(7000);
  }
}

function productQty(p){
  return cart.reduce(function(sum,x){
    return sum+(x.productId===p.id?x.q:0);
  },0);
}
function cardActionHtml(p){
  var q=productQty(p);
  if(!q){
    return '<button class="add" data-add-product="'+esc(p.id)+'" aria-label="'+t('Добавить в корзину','Себетке қосу')+'">+</button>';
  }
  return '<div class="cardQty" data-qty-product="'+esc(p.id)+'"><button data-card-minus="'+esc(p.id)+'" aria-label="'+t('Уменьшить','Азайту')+'">−</button><span>'+q+'</span><button data-card-plus="'+esc(p.id)+'" aria-label="'+t('Увеличить','Көбейту')+'">+</button></div>';
}
function productCard(p){
  var pic=p.imageUrl?'<img src="'+esc(p.imageUrl)+'" alt="" loading="eager" decoding="async" onerror="this.parentNode.innerHTML=\'<div class=placeholder>DC</div>\'">':'<div class="placeholder">DC</div>';
  var w=p.weightGrams?Math.round(p.weightGrams)+' г':'';
  return '<article class="card" data-card-product="'+esc(p.id)+'"><div class="photo">'+pic+'</div><div class="body"><div class="name">'+esc(productName(p))+' <span class="weight">'+esc(w)+'</span></div><div class="desc">'+esc(p.description||'')+'</div><div class="bottom"><div class="price">'+money(p.price)+'</div><div class="cardAction" data-action-product="'+esc(p.id)+'">'+cardActionHtml(p)+'</div></div></div></article>';
}
function bindProductButtons(root){
  var scope=root||document;
  scope.querySelectorAll('[data-card-product]').forEach(function(card){
    card.onclick=function(){
      var product=products.find(function(p){return p.id===card.dataset.cardProduct});
      if(product)handleProduct(product);
    };
  });
  scope.querySelectorAll('[data-add-product]').forEach(function(b){
    b.onclick=function(event){
      event.stopPropagation();
      var product=products.find(function(p){return p.id===b.dataset.addProduct});
      if(product)handleProduct(product);
    };
  });
  scope.querySelectorAll('[data-card-plus]').forEach(function(b){
    b.onclick=function(event){
      event.stopPropagation();
      var product=products.find(function(p){return p.id===b.dataset.cardPlus});
      if(product)increaseProductFromCard(product);
    };
  });
  scope.querySelectorAll('[data-card-minus]').forEach(function(b){
    b.onclick=function(event){
      event.stopPropagation();
      decreaseProductFromCard(b.dataset.cardMinus);
    };
  });
}
function refreshCardActions(){
  document.querySelectorAll('[data-action-product]').forEach(function(box){
    var product=products.find(function(p){return p.id===box.dataset.actionProduct});
    if(product)box.innerHTML=cardActionHtml(product);
  });
  bindProductButtons(document);
}
function animateAdded(productId){
  var card=document.querySelector('[data-card-product="'+CSS.escape(productId)+'"]');
  if(card){
    card.classList.remove('addedPulse');
    void card.offsetWidth;
    card.classList.add('addedPulse');
    setTimeout(function(){card.classList.remove('addedPulse')},600);
  }
  var bar=document.querySelector('.orderbar');
  var top=document.getElementById('cartHead');
  [bar,top].forEach(function(el){
    if(!el)return;
    el.classList.remove('cartPulse');
    void el.offsetWidth;
    el.classList.add('cartPulse');
    setTimeout(function(){el.classList.remove('cartPulse')},600);
  });
}
function updateNavActive(){
  document.querySelectorAll('#cats [data-cat]').forEach(function(b){
    b.classList.toggle('on', b.dataset.cat===activeCat);
  });
}
function scrollToCategory(categoryId){
  var content=document.querySelector('.content');
  if(!content)return;

  // Highlight immediately and temporarily stop the scroll observer from
  // switching the highlight back while the smooth scroll is still moving.
  activeCat=categoryId;
  navScrollLockUntil=Date.now()+700;
  updateNavActive();

  if(categoryId==='all'){
    content.scrollTo({top:0,behavior:'smooth'});
    setTimeout(syncActiveCategoryFromScroll,720);
    return;
  }

  var section=document.querySelector('[data-menu-section="'+CSS.escape(categoryId)+'"]');
  if(!section)return;
  var contentRect=content.getBoundingClientRect();
  var sectionRect=section.getBoundingClientRect();
  var target=content.scrollTop+(sectionRect.top-contentRect.top)-8;
  content.scrollTo({top:Math.max(0,target),behavior:'smooth'});
  setTimeout(syncActiveCategoryFromScroll,720);
}
function syncActiveCategoryFromScroll(){
  var content=document.querySelector('.content');
  if(!content||!categories.length)return;
  if(Date.now()<navScrollLockUntil)return;

  if(content.scrollTop<70){
    if(activeCat!=='all'){
      activeCat='all';
      updateNavActive();
    }
    return;
  }

  var contentTop=content.getBoundingClientRect().top;
  var current=null;
  categories.forEach(function(category){
    var section=document.querySelector('[data-menu-section="'+CSS.escape(category.id)+'"]');
    if(!section)return;
    var top=section.getBoundingClientRect().top-contentTop;
    if(top<=120) current=category.id;
  });
  if(current&&current!==activeCat){
    activeCat=current;
    updateNavActive();
  }
}

function decreaseProductFromCard(productId){
  var index=-1;
  for(var i=cart.length-1;i>=0;i--){
    if(cart[i].productId===productId){index=i;break;}
  }
  if(index<0)return;
  cart[index].q--;
  if(cart[index].q<=0)cart.splice(index,1);
  updateCart();
  refreshCardActions();
}
function addSimpleProduct(p){
  var mods=[],modIds=[],modGroupIds=[];
  var serviceExtra=appendServiceModifier(p,mods,modIds,modGroupIds);
  var key=p.id+'|'+modIds.slice().sort().join(',');
  var x=cart.find(function(z){return z.key===key});
  if(x)x.q++;
  else cart.push({
    key:key,
    productId:p.id,
    itemId:p.itemId,
    sizeId:p.sizeId,
    name:p.name,
    description:p.description||'',
    imageUrl:p.imageUrl||'',
    basePrice:p.price,
    unitPrice:p.price+serviceExtra,
    q:1,
    mods:mods,
    modifierIds:modIds,
    modifierGroupIds:modGroupIds
  });
  updateCart();
  refreshCardActions();
  animateAdded(p.id);
}
function removeSimpleProduct(productId){

  refreshCardActions();

  var ids={};
  cart.forEach(function(x){if(x.productId)ids[x.productId]=true});

function recommendedProducts(){
  var inCart=cartProductIds();
  var preferredNames=['Дополнительное','Дополнительно','Бар','Напитки','Чаи','Сладости','Фри','Стрипсы'];
  var preferredIds={};
  categories.forEach(function(category){
    if(preferredNames.indexOf(category.name)>=0)preferredIds[category.id]=true;
  });

  var pool=products.filter(function(p){
    return !inCart[p.id]&&preferredIds[p.categoryId];
  });

  if(pool.length<9){
    products.forEach(function(p){
      if(!inCart[p.id]&&pool.indexOf(p)<0)pool.push(p);
    });
  }

  function priority(p){
    var name=(p.name||'').toLowerCase().replace(/ё/g,'е');
    var category=(categories.find(function(c){return c.id===p.categoryId})||{}).name||'';
    category=category.toLowerCase().replace(/ё/g,'е');

    if(name.indexOf('стрип')>=0)return 0;
    if(name.indexOf('картофель фри')>=0 || name==='фри' || name.indexOf(' фри')>=0)return 1;
    if(name.indexOf('медов')>=0 && name.indexOf('соус')>=0)return 2;
    if(name.indexOf('фирмен')>=0 && name.indexOf('соус')>=0)return 3;

    // After the four main popular add-ons:
    // donut -> Chef Bubble -> teas -> garlic sauce.
    if(name.indexOf('пончик')>=0)return 4;
    if(name.indexOf('шеф bubble')>=0 || name.indexOf('chef bubble')>=0 || name.indexOf('bubble')>=0)return 5;
    if(category.indexOf('чай')>=0 || name.indexOf('чай')>=0 || name.indexOf('lipton')>=0)return 6;
    if(name.indexOf('чесноч')>=0 && name.indexOf('соус')>=0)return 7;

    if(name.indexOf('соус')>=0)return 8;
    if(name.indexOf('pepsi')>=0 || name.indexOf('айран')>=0 || name.indexOf('mirinda')>=0 || name.indexOf('вода')>=0 || name.indexOf('пиала')>=0 || name.indexOf('ava')>=0 || name.indexOf('да да')>=0 || name.indexOf('кинза')>=0)return 9;
    if(name.indexOf('десерт')>=0 || name.indexOf('слад')>=0)return 10;
    return 11;
  }

  pool.sort(function(a,b){
    var pa=priority(a),pb=priority(b);
    if(pa!==pb)return pa-pb;
    return Number(a.price||0)-Number(b.price||0);
  });

  return pool;
}

function phoneDigitsOnly(value){
  var raw=String(value||'').trim();
  var digits=raw.replace(/\D/g,'');
  // During keypad entry customerPhone stores the 10 local digits.
  // Strip +7 / 8 only when a full 11-digit Kazakhstan number is supplied.
  if(digits.length===11 && (digits.charAt(0)==='7' || digits.charAt(0)==='8')){
    digits=digits.slice(1);
  }
  return digits.slice(0,10);
}
function formattedPhone(){
  var d=phoneDigitsOnly(customerPhone);
  var out='+7';
  if(d.length>0)out+=' ('+d.slice(0,3);
  if(d.length>=3)out+=')';
  if(d.length>3)out+=' '+d.slice(3,6);
  if(d.length>6)out+=' '+d.slice(6,8);
  if(d.length>8)out+=' '+d.slice(8,10);
  return out;
}
function renderPhoneEntry(){
  var display=document.getElementById('phoneDisplay');
  var hint=document.getElementById('phoneHint');
  var continueBtn=document.getElementById('phoneContinue');
  if(!display||!hint||!continueBtn)return;
  var digits=phoneDigitsOnly(customerPhone);
  display.textContent=formattedPhone();
  display.classList.toggle('active',digits.length>0);
  continueBtn.disabled=digits.length!==10;
  hint.className='phoneHint';
  hint.textContent=digits.length===10
    ? t('Номер готов. Можно продолжить.','Нөмір дайын. Жалғастыруға болады.')
    : t('Введите 10 цифр после +7','+7-ден кейін 10 сан енгізіңіз');
}

function handlePushQuery(){
  try{
    var url=new URL(window.location.href);
    if(url.searchParams.get('push')==='1'){
      url.searchParams.delete('push');
      history.replaceState(null,'',url.pathname+(url.searchParams.toString()?'?'+url.searchParams.toString():'')+url.hash);
      setTimeout(pushMenuNow,50);
      return true;
    }
  }catch(e){}
  return false;
}
function enableGlobalMenuWheel(){
  document.addEventListener('wheel',function(event){
    if(event.ctrlKey)return;
    if(document.querySelector('#modalRoot .overlay'))return;
    var content=document.querySelector('.content');
    if(!content)return;
    if(Math.abs(event.deltaY)<=Math.abs(event.deltaX))return;

    // Over the menu itself, leave the browser's original/native wheel speed untouched.
    if(content.contains(event.target))return;

    // Outside the menu (header, category bar, empty side areas), forward the same wheel delta.
    event.preventDefault();
    content.scrollTop+=event.deltaY;
  },{passive:false});
}
